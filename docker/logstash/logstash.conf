# PARTIE 20 — Logstash : lit les logs JSON de l'API et les envoie à Elasticsearch
input {
  file {
    path => "/var/log/api/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => "json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ssZ"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["host", "log", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
}
